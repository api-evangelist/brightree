name: Brightree
description: Brightree is a ResMed company providing cloud-based business management
  software for post-acute care providers, including home medical equipment (HME),
  durable medical equipment (DME), home infusion and specialty pharmacy, orthotics
  and prosthetics, and home health and hospice organizations. Its platform automates
  the end-to-end operational workflow from intake, documentation and inventory through
  billing, delivery, resupply, and patient engagement. Brightree does not publish a
  public, self-service developer API; integrations are delivered through a partner-gated
  Integrated Vendor program, so this profile is limited to the company's public web
  presence rather than a developer portal or machine-readable API surface.
